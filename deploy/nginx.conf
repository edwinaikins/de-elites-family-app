# DE ELITES FAMILY — nginx reverse proxy
#
# Installed by deploy/setup-vm.sh at:
#   /etc/nginx/sites-available/de-elites-family
#   (symlinked into /etc/nginx/sites-enabled/)
#
# Fronts the Node app (listening on 127.0.0.1:3000) on port 80. Once you
# point a domain at this VM's IP, swap `server_name _;` for your real
# domain and run `sudo certbot --nginx` to get free auto-renewing HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
