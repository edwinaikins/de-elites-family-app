<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DE ELITES FAMILY</title>
    <meta name="description" content="DE ELITES FAMILY — a premium community built on Unity, Passion, Loyalty, and Respect. Explore our leadership, legacy, welfare scheme, and upcoming events." />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Canonical + Open Graph / Twitter card: now that de-elitesfamily.org
         is the real domain, these control what a shared link looks like in
         WhatsApp/Twitter/Facebook previews and tell search engines the
         canonical URL. Update the domain here (and below) if it ever
         changes — nothing else in the app depends on it. -->
    <link rel="canonical" href="https://de-elitesfamily.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://de-elitesfamily.org/" />
    <meta property="og:site_name" content="DE ELITES FAMILY" />
    <meta property="og:title" content="DE ELITES FAMILY" />
    <meta property="og:description" content="A premium community built on Unity, Passion, Loyalty, and Respect. Explore our leadership, legacy, welfare scheme, and upcoming events." />
    <meta property="og:image" content="https://de-elitesfamily.org/favicon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DE ELITES FAMILY" />
    <meta name="twitter:description" content="A premium community built on Unity, Passion, Loyalty, and Respect." />
    <meta name="twitter:image" content="https://de-elitesfamily.org/favicon-512.png" />

    <!-- Favicon: the DE ELITES crest, exported at the sizes browsers/OSes
         actually request. favicon.ico is for old browsers that never learned
         about PNG icons; the PNGs cover everything modern (tab icon, PWA
         home-screen icon on Android); apple-touch-icon.png is what iOS uses
         when someone adds the site to their home screen. All five files live
         in /public, which Vite copies to the site root as-is on build. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Paystack Inline checkout script. Loaded from Paystack's CDN so it
      resolves in the end user's browser — this only powers the member
      portal's dues/event payment popups, no page load cost otherwise.
    -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
