<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DE ELITES FAMILY</title>

    <!-- Favicon: the DE ELITES crest, exported at the sizes browsers/OSes
         actually request. favicon.ico is for old browsers that never learned
         about PNG icons; the PNGs cover everything modern (tab icon, PWA
         home-screen icon on Android); apple-touch-icon.png is what iOS uses
         when someone adds the site to their home screen. All five files live
         in /public, which Vite copies to the site root as-is on build. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Paystack Inline checkout script. Loaded from Paystack's CDN so it
      resolves in the end user's browser — this only powers the member
      portal's dues/event payment popups, no page load cost otherwise.
    -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
